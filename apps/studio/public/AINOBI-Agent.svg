<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
    <defs>
        <!-- 中心：压低对比，避免纯白抢眼 -->
        <radialGradient id="coreGlow" cx="50%" cy="48%" r="62%">
            <stop offset="0%" stop-color="#e0e7ff" stop-opacity="0.42" />
            <stop offset="38%" stop-color="#c7d2fe" stop-opacity="0.32" />
            <stop offset="68%" stop-color="#a5b4fc" stop-opacity="0.18" />
            <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
        </radialGradient>

        <!-- 外层：更散、更淡，径向半径拉大 -->
        <radialGradient id="auraOuter" cx="50%" cy="50%" r="68%">
            <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22" />
            <stop offset="50%" stop-color="#6366f1" stop-opacity="0.08" />
            <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
        </radialGradient>

        <!-- 中层：色心更柔、边缘更早透明，模糊后更像一团光 -->
        <radialGradient id="auraCyan" cx="44%" cy="42%" r="72%">
            <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.38" />
            <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.14" />
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="auraRose" cx="56%" cy="48%" r="72%">
            <stop offset="0%" stop-color="#fce7f3" stop-opacity="0.34" />
            <stop offset="38%" stop-color="#f0abfc" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#c026d3" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="auraViolet" cx="48%" cy="56%" r="70%">
            <stop offset="0%" stop-color="#ede9fe" stop-opacity="0.32" />
            <stop offset="42%" stop-color="#a78bfa" stop-opacity="0.11" />
            <stop offset="100%" stop-color="#6d28d9" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#67e8f9" />
            <stop offset="100%" stop-color="#22d3ee" />
        </linearGradient>
        <linearGradient id="gradMagenta" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f9a8d4" />
            <stop offset="100%" stop-color="#e879f9" />
        </linearGradient>
        <linearGradient id="gradPurple" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#c4b5fd" />
            <stop offset="100%" stop-color="#a78bfa" />
        </linearGradient>

        <!-- 环境层：仅输出模糊，不叠原图，避免看出椭圆轮廓 -->
        <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
            <feGaussianBlur in="SourceGraphic" stdDeviation="38" result="b1" />
            <feGaussianBlur in="b1" stdDeviation="22" result="b2" />
            <feMerge>
                <feMergeNode in="b2" />
                <feMergeNode in="b1" />
            </feMerge>
        </filter>

        <!-- 体积光：仅双层模糊，彻底去掉锐利椭圆边 -->
        <filter id="glowBody" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
            <feGaussianBlur in="SourceGraphic" stdDeviation="42" result="b1" />
            <feGaussianBlur in="b1" stdDeviation="24" result="b2" />
            <feMerge>
                <feMergeNode in="b2" />
                <feMergeNode in="b1" />
            </feMerge>
        </filter>

        <!-- 核心：只保留柔和光球，无锐利边缘 -->
        <filter id="glowCore" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
            <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b" />
            <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- 轨道粒子：弱外发光，避免粒子过亮 -->
        <filter id="glowOrbit" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b1" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b2" />
            <feMerge>
                <feMergeNode in="b2" />
                <feMergeNode in="b1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <filter id="glowRing" x="-45%" y="-45%" width="190%" height="190%" color-interpolation-filters="sRGB">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b2" />
            <feMerge>
                <feMergeNode in="b2" />
                <feMergeNode in="b1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- 1. 环境慢旋：初始角错开 -->
    <g filter="url(#glowSoft)" opacity="0.9">
        <ellipse cx="400" cy="400" rx="305" ry="118" fill="url(#auraOuter)">
            <animateTransform attributeName="transform" type="rotate" from="-17 400 400" to="343 400 400" dur="28s" repeatCount="indefinite" />
            <animate attributeName="rx" values="305; 338; 305" dur="11s" repeatCount="indefinite" />
            <animate attributeName="ry" values="118; 152; 118" dur="13s" repeatCount="indefinite" />
        </ellipse>
    </g>

    <!-- 2. 流动体积光：错开起始角 + 反向速度不同 -->
    <g filter="url(#glowBody)" opacity="1">
        <ellipse cx="400" cy="400" rx="178" ry="98" fill="url(#auraCyan)">
            <animateTransform attributeName="transform" type="rotate" from="41 400 400" to="401 400 400" dur="14s" repeatCount="indefinite" />
            <animate attributeName="rx" values="178; 208; 178" dur="7s" repeatCount="indefinite" />
            <animate attributeName="ry" values="98; 128; 98" dur="9s" repeatCount="indefinite" />
        </ellipse>

        <ellipse cx="400" cy="400" rx="192" ry="80" fill="url(#auraRose)">
            <animateTransform attributeName="transform" type="rotate" from="158 400 400" to="518 400 400" dur="11s" repeatCount="indefinite" />
            <animate attributeName="rx" values="192; 218; 192" dur="8s" repeatCount="indefinite" />
            <animate attributeName="ry" values="80; 110; 80" dur="10s" repeatCount="indefinite" />
        </ellipse>

        <ellipse cx="400" cy="400" rx="158" ry="108" fill="url(#auraViolet)">
            <animateTransform attributeName="transform" type="rotate" from="196 400 400" to="556 400 400" dur="18s" repeatCount="indefinite" />
            <animate attributeName="rx" values="158; 188; 158" dur="6s" repeatCount="indefinite" />
            <animate attributeName="ry" values="108; 84; 108" dur="8s" repeatCount="indefinite" />
        </ellipse>
    </g>

    <!-- 3. 中心：弱高光，无纯白硬点 -->
    <g filter="url(#glowCore)" opacity="0.92">
        <circle cx="400" cy="400" r="44" fill="url(#coreGlow)">
            <animate attributeName="r" values="44; 52; 44" dur="3.4s" repeatCount="indefinite" />
        </circle>
        <circle cx="400" cy="400" r="18" fill="#f8fafc" opacity="0.22">
            <animate attributeName="r" values="18; 24; 18" dur="3.4s" repeatCount="indefinite" />
        </circle>
    </g>

    <!-- 4. 粒子轨道：更弱、更细 -->
    <g filter="url(#glowOrbit)" fill="none" stroke-linecap="round" opacity="0.52">
        <circle cx="400" cy="400" r="242" stroke="url(#gradCyan)" stroke-width="3" stroke-opacity="0.48" stroke-dasharray="1.5 279">
            <animateTransform attributeName="transform" type="rotate" from="23 400 400" to="383 400 400" dur="9s" repeatCount="indefinite" />
        </circle>

        <circle cx="400" cy="400" r="262" stroke="url(#gradMagenta)" stroke-width="2.5" stroke-opacity="0.42" stroke-dasharray="1.5 319">
            <animateTransform attributeName="transform" type="rotate" from="691 400 400" to="331 400 400" dur="15s" repeatCount="indefinite" />
        </circle>

        <g opacity="0.55">
            <animateTransform attributeName="transform" type="rotate" from="118 400 400" to="478 400 400" dur="22s" repeatCount="indefinite" />
            <ellipse cx="400" cy="400" rx="272" ry="58" stroke="url(#gradPurple)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="1.5 349" transform="rotate(-31 400 400)" />
        </g>
    </g>

    <!-- 5. 脉冲扫描环 -->
    <!-- <g filter="url(#glowRing)" opacity="0.9">
        <circle cx="400" cy="400" r="52" fill="none" stroke="rgba(226, 232, 240, 0.5)" stroke-width="2">
            <animate attributeName="r" values="52; 340" dur="4s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.7; 0" dur="4s" repeatCount="indefinite" />
        </circle>
        <circle cx="400" cy="400" r="52" fill="none" stroke="rgba(199, 210, 254, 0.42)" stroke-width="2">
            <animate attributeName="r" values="52; 340" dur="4s" begin="2s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.58; 0" dur="4s" begin="2s" repeatCount="indefinite" />
        </circle>
    </g> -->
</svg>
