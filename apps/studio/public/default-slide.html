<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AINOBI Default Cover</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #f7fbff;
            overflow: hidden;
        }

        .cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }
    </style>
</head>
<body>
    <img class="cover" src="/AINOBI-Ready-Cover.jpeg" alt="AINOBI cover">
</body>
</html>
