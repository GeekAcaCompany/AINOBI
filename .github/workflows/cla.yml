name: CLA

# Asks each outside contributor to agree to CLA.md once, by a pull request comment, and records the agreement in
# signatures/cla.json on the cla-signatures branch. That branch must stay unprotected so this workflow can write to it.
# The job never checks out or runs pull request code, which is what makes pull_request_target safe here.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: cla
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event.issue.pull_request
          && (github.event.comment.body == 'recheck'
              || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: Check the signatures
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/GeekAcaCompany/AINOBI/blob/main/CLA.md
          branch: cla-signatures
          # Bots sign nothing. Add GeekAca staff here: their work already belongs to GeekAca.
          allowlist: dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
