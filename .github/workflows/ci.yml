name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install locked dependencies
        id: install
        run: npx --yes pnpm@10.5.0 install --frozen-lockfile

      - name: Type check the packages
        run: npx pnpm@10.5.0 typecheck

      # The later steps still run after a failure so that one run shows every failure.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx pnpm@10.5.0 lint

      - name: Test the packages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx pnpm@10.5.0 test

      - name: Build and test the apps
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npx pnpm@10.5.0 --filter @ainobi/lite-stores build
          npx pnpm@10.5.0 --filter ainobi-courseware-service --filter @ainobi/studio build
          npx pnpm@10.5.0 --filter ainobi-courseware-service --filter ainobi-video-render-service --filter @ainobi/studio test
