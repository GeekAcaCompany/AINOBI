name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install locked dependencies
        id: install
        run: npx --yes pnpm@10.5.0 install --frozen-lockfile

      - name: Type check the packages
        run: npx pnpm@10.5.0 typecheck

      # The later steps still run after a failure so that one run shows every failure.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx pnpm@10.5.0 lint

      - name: Test the packages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx pnpm@10.5.0 test

  apps:
    name: apps
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ainobi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DB_TYPE: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: ainobi
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install locked dependencies
        run: npx --yes pnpm@10.5.0 install --frozen-lockfile

      - name: Create the tables
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ainobi -q -v ON_ERROR_STOP=1 -f apps/studio/server/schema.sql

      - name: Build
        run: |
          npx pnpm@10.5.0 --filter @ainobi/lite-stores --filter @ainobi/avatar-generator --filter @ainobi/tts build
          npx pnpm@10.5.0 --filter ainobi-courseware-service --filter @ainobi/studio build

      - name: Test
        run: npx pnpm@10.5.0 --filter ainobi-courseware-service --filter ainobi-video-render-service --filter ainobi-pdf2html-service --filter ainobi-pptx2html-service --filter @ainobi/studio test
