name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # The scanner must show it can detect before it is trusted to clear: a build that stops loading the custom
      # rules would otherwise pass quietly. The probe is assembled here so the scanner never matches this file.
      - name: Check that every custom rule fires
        run: |
          pad=AbCdEfGhIjKlMnOpQrStUvWxYz0123456789
          {
            echo "const a = \"cfat_$pad\";"
            echo "const b = \"xai-$pad\";"
            echo "const c = \"tvly-$pad\";"
            echo "const d = \"sk-ws-$pad\";"
            echo "const e = \"LTAI$pad\";"
            echo "const f = \"AKIA$(printf 'ABCDEFGHIJKLMNOP')\";"
            echo "const g = \"AQ.$pad$pad\";"
            echo "const h = \"ainobi_ak_0123456789abcdef0123456789abcdef_$pad\";"
            echo "const i = { internal_token: \"0123456789abcdef0123456789abcdef\" };"
            echo "const j = env(\"MY_API_KEY\", \"abc12345value\");"
            echo "const k = \"https://example.ap-northeast-1.$(printf fcapp).run\";"
          } > .gitleaks-selftest-probe.ts
          if gitleaks detect --source . --config .gitleaks.toml --no-git --redact --report-format json --report-path /tmp/selftest.json; then
            echo "SELF-TEST FAILED: nothing was detected" >&2
            rm .gitleaks-selftest-probe.ts
            exit 1
          fi
          rm .gitleaks-selftest-probe.ts
          missing=0
          for id in cloudflare-api-token xai-key tavily-key dashscope-key aliyun-accesskey aws-accesskey \
            google-new-style-key ainobi-agent-key internal-secret-assignment hardcoded-credential-default \
            internal-infrastructure; do
            if ! grep -qE "\"RuleID\": ?\"$id\"" /tmp/selftest.json; then
              echo "SELF-TEST FAILED: rule $id did not fire" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Scan the working tree
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --no-git

      - name: Scan every commit
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --log-opts=--all
